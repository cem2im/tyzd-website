<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1080px; height: 1350px; overflow: hidden; background: #000000; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased;">

    <!-- Background gradient mesh -->
    <div style="position: absolute; inset: 0; overflow: hidden;">
        <div style="position: absolute; width: 800px; height: 800px; top: -200px; right: -200px; background: radial-gradient(circle, rgba(20,184,166,0.15) 0%, transparent 60%); filter: blur(80px);"></div>
        <div style="position: absolute; width: 600px; height: 600px; bottom: -100px; left: -150px; background: radial-gradient(circle, rgba(6,182,212,0.12) 0%, transparent 60%); filter: blur(80px);"></div>
        <div style="position: absolute; width: 400px; height: 400px; top: 40%; left: 50%; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(14,165,233,0.08) 0%, transparent 60%); filter: blur(60px);"></div>
    </div>

    <!-- Grid background -->
    <div style="position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 60px 60px; mask-image: radial-gradient(ellipse at center, black 0%, transparent 80%); -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 80%);"></div>

    <!-- Content container -->
    <div style="position: relative; z-index: 1; width: 1080px; height: 1350px; display: flex; flex-direction: column; padding: 60px;">

        <!-- Top: Logo -->
        <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 60px;">
            <div style="width: 48px; height: 48px; background: linear-gradient(135deg, #14b8a6 0%, #06b6d4 50%, #0ea5e9 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center;">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                </svg>
            </div>
            <span style="color: #ffffff; font-size: 22px; font-weight: 600; letter-spacing: -0.01em;">TYZD</span>
        </div>

        <!-- Category badge -->
        <div style="margin-bottom: 40px;">
            <span style="display: inline-block; padding: 8px 20px; background: rgba(20,184,166,0.15); border: 1px solid rgba(20,184,166,0.3); border-radius: 100px; font-size: 14px; font-weight: 600; color: #14b8a6; text-transform: uppercase; letter-spacing: 0.1em;">{{CATEGORY}}</span>
        </div>

        <!-- Main headline -->
        <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
            <h1 style="margin: 0 0 28px 0; font-size: 58px; font-weight: 800; line-height: 1.1; letter-spacing: -0.03em; color: #ffffff; max-width: 900px;">{{HEADLINE}}</h1>
            <p style="margin: 0; font-size: 24px; line-height: 1.5; color: #a1a1aa; max-width: 800px; font-weight: 400;">{{SUBHEADLINE}}</p>
        </div>

        <!-- Bottom: Branding + dots -->
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <span style="color: #71717a; font-size: 14px; font-weight: 500;">tyzd.org</span>
                <span style="color: #71717a; font-size: 14px;">·</span>
                <span style="color: #71717a; font-size: 14px; font-weight: 500;">Tıpta Yapay Zeka Derneği</span>
            </div>
            <!-- Slide dots -->
            <div style="display: flex; gap: 8px; align-items: center;">
                <div style="width: 24px; height: 8px; border-radius: 4px; background: linear-gradient(135deg, #14b8a6, #06b6d4);"></div>
                <div style="width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2);"></div>
                <div style="width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2);"></div>
                <div style="width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2);"></div>
            </div>
        </div>

    </div>

    <!-- Accent line at top -->
    <div style="position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #14b8a6 0%, #06b6d4 50%, #0ea5e9 100%);"></div>

</body>
</html>
