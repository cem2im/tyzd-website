<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; width: 1080px; height: 1350px; overflow: hidden; background: #000000; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased;">

    <!-- Background gradient mesh -->
    <div style="position: absolute; inset: 0; overflow: hidden;">
        <div style="position: absolute; width: 600px; height: 600px; top: -100px; left: -100px; background: radial-gradient(circle, rgba(20,184,166,0.1) 0%, transparent 60%); filter: blur(80px);"></div>
        <div style="position: absolute; width: 500px; height: 500px; bottom: -100px; right: -100px; background: radial-gradient(circle, rgba(6,182,212,0.08) 0%, transparent 60%); filter: blur(80px);"></div>
    </div>

    <!-- Grid background -->
    <div style="position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px); background-size: 60px 60px; mask-image: radial-gradient(ellipse at center, black 0%, transparent 80%); -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 80%);"></div>

    <!-- Content container -->
    <div style="position: relative; z-index: 1; width: 1080px; height: 1350px; display: flex; flex-direction: column; padding: 60px;">

        <!-- Top bar: Logo + Page number -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 80px;">
            <!-- Logo -->
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 36px; height: 36px; background: linear-gradient(135deg, #14b8a6 0%, #06b6d4 50%, #0ea5e9 100%); border-radius: 8px; display: flex; align-items: center; justify-content: center;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                    </svg>
                </div>
                <span style="color: #a1a1aa; font-size: 16px; font-weight: 600;">TYZD</span>
            </div>
            <!-- Page number -->
            <div style="padding: 6px 16px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-radius: 100px; font-size: 14px; font-weight: 600; color: #a1a1aa; letter-spacing: 0.05em;">3/4</div>
        </div>

        <!-- Section title -->
        <h2 style="margin: 0 0 60px 0; font-size: 42px; font-weight: 700; line-height: 1.2; letter-spacing: -0.02em; background: linear-gradient(135deg, #14b8a6 0%, #06b6d4 50%, #0ea5e9 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; max-width: 900px;">Sınırlılıklar ve Gelecek</h2>

        <!-- Bullet points -->
        <div style="flex: 1; display: flex; flex-direction: column; gap: 40px;">

            <!-- Bullet 1 -->
            <div style="display: flex; gap: 24px; align-items: flex-start;">
                <div style="width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg, #14b8a6, #06b6d4); flex-shrink: 0; margin-top: 10px;"></div>
                <p style="margin: 0; font-size: 28px; line-height: 1.5; color: #e4e4e7; font-weight: 400; max-width: 880px;">LLM'ler henüz klinik için yetersiz</p>
            </div>

            <!-- Bullet 2 -->
            <div style="display: flex; gap: 24px; align-items: flex-start;">
                <div style="width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg, #06b6d4, #0ea5e9); flex-shrink: 0; margin-top: 10px;"></div>
                <p style="margin: 0; font-size: 28px; line-height: 1.5; color: #e4e4e7; font-weight: 400; max-width: 880px;">Bilimsel kanıtlar AI'nin faydasını gösterir</p>
            </div>

            <!-- Bullet 3 -->
            <div style="display: flex; gap: 24px; align-items: flex-start;">
                <div style="width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg, #14b8a6, #0ea5e9); flex-shrink: 0; margin-top: 10px;"></div>
                <p style="margin: 0; font-size: 28px; line-height: 1.5; color: #e4e4e7; font-weight: 400; max-width: 880px;">Eğitim ve etik önem taşıyor</p>
            </div>

        </div>

        <!-- Bottom: Branding -->
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <span style="color: #71717a; font-size: 14px; font-weight: 500;">tyzd.org · Tıpta Yapay Zeka Derneği</span>
            <!-- Slide dots (middle active) -->
            <div style="display: flex; gap: 8px; align-items: center;">
                <div style="width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2);"></div>
                <div style="width: 24px; height: 8px; border-radius: 4px; background: linear-gradient(135deg, #14b8a6, #06b6d4);"></div>
                <div style="width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2);"></div>
                <div style="width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2);"></div>
            </div>
        </div>

    </div>

    <!-- Accent line at top -->
    <div style="position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #14b8a6 0%, #06b6d4 50%, #0ea5e9 100%);"></div>

</body>
</html>
